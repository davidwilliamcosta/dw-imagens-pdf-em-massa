server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # HTML e manifest: o navegador sempre revalida (ETag), então um deploy novo
    # aparece no próximo acesso. JS/WASM podem ficar em cache à vontade: as URLs
    # levam ?v=<hash do conteúdo> (ver deploy/stamp.py) e mudam quando o arquivo muda.
    location ~* \.(html|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    location ~* \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
